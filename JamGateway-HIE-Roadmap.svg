<text x="40" y="344" font-size="11" font-weight="800" fill="#5B21B6">★ Coming next: Client Registry (Master Patient Index) — the most critical missing piece</text>
<text x="40" y="362" font-size="9" fill="#4C1D95">Without a Client Registry, the gateway routes requests correctly but systems cannot confirm two records at different facilities belong to the same patient.</text>
<text x="40" y="378" font-size="9" fill="#4C1D95">HAPI FHIR MDM module implements golden record management, probabilistic matching, Patient/$match, and IHE PMIR (ITI-93/94)</text>
<text x="40" y="394" font-size="9" fill="#4C1D95">— all on infrastructure already in the JamGateway stack. No new service, no new database, no new language runtime.</text>
<text x="40" y="414" font-size="8" fill="#6D28D9" font-weight="600">IHE PMIR ITI-93: Mobile Patient Identity Feed (push)  ·  ITI-94: Subscribe to Patient Updates  ·  HAPI MDM: configurable JSON matching rules  ·  Patient/$match operation</text>
